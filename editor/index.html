<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Cena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: mesa de trabalho. Canvas no alto, camadas e propriedades lado a lado embaixo (empilham no celular). */
:root {
  --fundo: #eceae4;
  --mesa: #f8f7f3;
  --tinta: #1d1a16;
  --tinta-suave: #6a645b;
  --linha: #d6d2c8;
  --ouro: #b5780f;
  --ouro-fundo: #f3e6c8;
  --erro: #a3271c;
  --f-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texto: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-dado: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #15130f; --mesa: #1f1c17; --tinta: #efeae0; --tinta-suave: #a39b8d;
    --linha: #3a352c; --ouro: #f0b03a; --ouro-fundo: #3a2c12; --erro: #f08a7e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #15130f; --mesa: #1f1c17; --tinta: #efeae0; --tinta-suave: #a39b8d;
  --linha: #3a352c; --ouro: #f0b03a; --ouro-fundo: #3a2c12; --erro: #f08a7e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta); font: 14px/1.5 var(--f-texto);
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; }
h1 { font: 700 22px/1.1 var(--f-titulo); margin: 0; letter-spacing: -0.01em; }
#titulo { font: 400 12px var(--f-dado); color: var(--tinta-suave); }
.acoes { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
button, .botao {
  font: 500 13px var(--f-texto); color: var(--tinta); background: var(--mesa);
  border: 1px solid var(--linha); border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
button:hover, .botao:hover { border-color: var(--ouro); }
button:focus-visible, input:focus-visible, select:focus-visible, .botao:focus-within { outline: 2px solid var(--ouro); outline-offset: 1px; }
.botao input { display: none; }
#area { background: repeating-conic-gradient(var(--linha) 0 25%, var(--mesa) 0 50%) 0 0 / 16px 16px; border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; min-width: 0; }
.baixo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; }
@media (max-width: 760px) { .baixo { grid-template-columns: minmax(0, 1fr); } }
section { background: var(--mesa); border: 1px solid var(--linha); border-radius: 8px; padding: 12px 14px; min-width: 0; }
h2 { font: 500 11px var(--f-texto); text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-suave); margin: 0 0 8px; }
h3 { font: 700 16px var(--f-titulo); margin: 0 0 4px; }
#camadas { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#camadas li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 56px; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 5px; }
#camadas li.ativo { background: var(--ouro-fundo); }
#camadas .nome { cursor: pointer; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#camadas .papel { font: 400 11px var(--f-dado); color: var(--tinta-suave); }
#camadas button { border: 0; background: none; padding: 2px; color: var(--tinta-suave); }
#camadas .cadeado { font: 400 11px var(--f-dado); text-align: right; }
#camadas .cadeado[aria-pressed="true"] { color: var(--ouro); }
.dica { color: var(--tinta-suave); font-size: 12.5px; margin: 0 0 10px; max-width: 65ch; }
#linhas { display: grid; gap: 6px; margin-bottom: 8px; }
.linha { display: grid; grid-template-columns: minmax(0, 1fr) 96px 64px 28px; gap: 6px; }
input, select { font: 400 13px var(--f-texto); color: var(--tinta); background: var(--fundo); border: 1px solid var(--linha); border-radius: 5px; padding: 5px 7px; min-width: 0; }
input[type="number"] { font-family: var(--f-dado); font-variant-numeric: tabular-nums; }
#propriedades label { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--tinta-suave); font-size: 12.5px; }
#propriedades label input, #propriedades label select { width: 110px; }
#erros { color: var(--erro); font: 400 12px var(--f-dado); white-space: pre-wrap; margin: 0; }
#erros:empty { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "fabric": "https://cdn.jsdelivr.net/npm/fabric@7.4.0/+esm",
  "yoga-layout": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/+esm"
} }
</script>
</head>
<body>
<div class="app">
  <header>
    <h1>Mesa de Cena</h1>
    <span id="titulo">carregando…</span>
    <div class="acoes">
      <label class="botao" for="abrir">Abrir cena<input id="abrir" type="file" accept="application/json,.json"></label>
      <button id="baixar-json" type="button">Salvar cena (JSON)</button>
      <button id="baixar-png" type="button">Exportar PNG</button>
    </div>
  </header>
  <pre id="erros"></pre>
  <div id="area"><canvas id="tela"></canvas></div>
  <div class="baixo">
    <section>
      <h2>Camadas</h2>
      <ul id="camadas"></ul>
    </section>
    <section>
      <h2>Propriedades</h2>
      <div id="propriedades"></div>
    </section>
  </div>
</div>
<script>window.CENA_PADRAO = '../exemplos/capivara362-home-vip/cena.json';</script>
<script type="module" src="./editor.js"></script>
</body>
</html>
